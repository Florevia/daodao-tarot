services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daodao
      POSTGRES_PASSWORD: daodao
      POSTGRES_DB: daodao
    ports:
      - "5432:5432"
    volumes:
      - daodao-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daodao -d daodao"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  daodao-pg:
